apiVersion: v1
kind: Service
metadata:
  name: upi-fraud-service
  labels:
    app: upi-fraud-app
spec:
  type: NodePort
  selector:
    app: upi-fraud-app
  ports:
    - name: http-ui
      port: 8501
      targetPort: 8501
      nodePort: 30501
    - name: http-metrics
      port: 8000
      targetPort: 8000
      nodePort: 30800
